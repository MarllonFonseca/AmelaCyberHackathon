name: DAST
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and start app
        run: |
          docker build -t hackathon-app .
          docker run -d -p 3000:3000 --name hackathon-app hackathon-app
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health; then exit 0; fi
            sleep 2
          done
          docker logs hackathon-app
          exit 1
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          allow_issue_writing: false
